---
# Playbook: ovpn_setup.yml
# Purpose: bootstrap the OpenVPN DMZ gateway (homelab-ovpn) — base
# configuration, firewall, OpenVPN server and node_exporter.

- name: Apply common configuration to OpenVPN server
  hosts: homelab-ovpn
  become: true
  gather_facts: true
  roles:
    - role: tititwister.homelab.common
      tags:
        - role:common
        - category:system

- name: Configure firewall on OpenVPN server
  hosts: homelab-ovpn
  become: true
  gather_facts: true
  roles:
    - role: tititwister.homelab.firewall
      tags:
        - role:firewall
        - category:system

- name: Setup OpenVPN server
  hosts: homelab-ovpn
  become: true
  gather_facts: true
  roles:
    - role: tititwister.homelab.openvpn
      tags:
        - role:openvpn
        - category:network

- name: Install Node Exporter on OpenVPN server
  hosts: homelab-ovpn
  become: true
  gather_facts: true
  roles:
    - role: tititwister.homelab.node_exporter
      tags:
        - role:node_exporter
        - category:monitoring
